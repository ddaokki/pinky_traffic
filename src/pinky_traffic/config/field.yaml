# 현장(학원) 설정. 내일 테이프를 깔고 나서 '★' 표시된 값부터 맞춘다.
# 여기 없는 값은 pinky_traffic/core/config.py 의 기본값을 쓴다.

weights: models/best.pt
conf: 0.4
imgsz: 320

# ★ 차선 테이프 색 (hsv_tuner 로 찾는다). 아래는 흰 테이프 기준. 2026-10-03 현장: 차선·횡단보도 모두 흰 테이프.
lane_hsv_lo: [0, 0, 170]
lane_hsv_hi: [179, 70, 255]
# ★ 횡단보도를 차선과 다른 색 테이프로 깔았으면 주석을 풀고 값을 넣는다.
#   같은 색이면 그대로 둔다 (모양으로 구분한다).
# crosswalk_hsv_lo: [20, 100, 120]
# crosswalk_hsv_hi: [35, 255, 255]

# 처음에는 느리게. 한 바퀴 돌면 0.02 씩 올린다.
v_max: 0.08
kp: 1.35                    # 2026-10-09 실주행: 1.6은 직선에서도 좌우 조향이 자주 뒤집힘
kd: 0.12                    # 영상 프레임별 차선 중심 잡음에 미분항이 과민하지 않게
k_heading: 0.0

crosswalk_stop_sec: 3.0     # 2026-10-04: 5초는 길어서 3초로
crossing_sec: 8.0        # 횡단보도 뒤 흰 레인을 다시 잡을 때까지 곧장 전진 (5초는 2~3초 일찍 끝나 lost)
crosswalk_stop_row: 0.80

obstacle_stop_m: 0.10       # 2026-10-04: 0.22 는 벽 가까운 코너에서 돌기도 전에 멈췄다. 2026-10-09: 가벽 코너에서 0.148 에 걸려 0.10
lidar_yaw_offset_deg: 180.0 # ★ 2026-10-03 현장: pinky1 라이다 0도가 뒤쪽이라 180

# ★ 주차 통로: 흰 차선 끝에서 이어지는 색 테이프. 이 로봇이 갈 칸의 색 (red | blue | 빈칸이면 안 씀)
#   통로에 들어서면 그 색만 따라가고, 칸 끝 벽이 park_stop_m 안에 오면 parked (LED 초록)
route_color: ''              # 2026-10-04 새 맵: 주차 통로(빨강/파랑) 없음. 파랑은 유턴 선으로 쓴다 (lane_role)
# 새 맵 역할은 실행할 때 준다: scripts/drive.sh pinky1 24 hsv "" 1  (1 = 1차선·파란 선 유턴, 2 = 2차선·초록 칸)
lane_role: 0
sign_advance_m: 0.06        # 직우 표지판 도착 뒤 6cm 추가 전진
sign_arrive_far_row: 0.75   # 0.73의 체감이 작아 표지판 위로 조금 더 전진
plan_lane1: 'turn:right:0.10, turn:right:0.07, any:straight'  # 첫 우회전(R1)은 15cm 더 가서 다음 회전 표지를 정면에 둔다 (0.10 은 다음 표지가 안 보임)
sign_shape: false            # 모양 분류는 보는 각도에 따라 틀린다 (2026-10-10: 정면의 직우를 '우회전'으로 분류해 2차선이 직우를 무시). 가까운 순서로 고른다
sign_backoff_m: 0.12         # 회전 뒤 다음 표지가 카메라 바로 밑이면 전체가 보일 때까지 후진 (최대 12cm), 멈춰서 0.8초 본다
plan_lane2: 'straight_right:straight, turn:left:0.06, turn:left:0.06'  # 좌회전 표지는 파랑이 사라진 뒤 6cm 더 전진
plan_lane2_exit: 'any:right, turn:left:0.06, turn:left:0.06'
park_stop_m: 0.15           # ★ 라이다~벽 거리. 칸 끝 선을 넘으면 키우고, 너무 앞에서 서면 줄인다

# 2대 운용 (1대 시연이 끝난 뒤에)
use_coordinator: true       # 2026-10-04: 2대 주행. 유턴 구간(junction)과 횡단보도를 한 대씩 지나간다. 대시보드가 켜져 있어야 한다
dashboard_url: http://127.0.0.1:8088

# 한쪽 선만 보일 때 쓰는 차선폭 초기값 (영상 폭 대비). 실주행에서 두 선이 같이 보일 때 잰 값: 가까운 행 약 1.0, 먼 행 약 0.6.
# 기본값 1.3 은 실제보다 넓어 왼쪽 선만 보이면 가운데를 화면 밖 오른쪽으로 잡고 급하게 꺾었다 (2026-10-10 pinky2 마지막 좌회전 뒤)
lane_width_near: 1.15
lane_width_far: 0.65
single_line_width: 1.10     # 한쪽 선만 보일 때 쓰는 폭 상한 (0.70·0.90 은 보이는 중앙선에 붙어 달렸다)
